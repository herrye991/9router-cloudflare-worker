name: Cloudflare App (OpenNext)

# Builds and deploys the FULL 9Router Next.js app (dashboard + API) to Cloudflare
# Workers via @opennextjs/cloudflare. This is SEPARATE from the companion sync/proxy
# worker (cloud/ → cloudflare-worker.yml).
#
# ⚠️  The edge build is DEGRADED. Many server features require Node (cloudflared/tailscale
#     tunnels, MITM proxy, CLI-tool auto-config, OAuth file auto-import, node-machine-id,
#     native SQLite) and throw a clear error at the edge. App state is ephemeral unless
#     the DB is wired to D1 (see docs/CLOUDFLARE.md). The Node/Docker deployment remains
#     the full-featured path.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (Cloudflare token, Workers: Edit)  — for the Action
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare account ID)            — for the Action
#   JWT_SECRET             (app session signing)              — REQUIRED at the edge:
#                         without it the app tries to write a jwt-secret file, but the
#                         Workers filesystem is read-only, so boot would crash.
#
# Optional (have safe defaults — leave unset unless you know you need them):
#   INITIAL_PASSWORD, API_KEY_SECRET, MACHINE_ID_SALT  (runtime secrets)
#   NEXT_PUBLIC_BASE_URL  (Actions *variable*; build-time public base URL)

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "open-sse/**"
      - "public/**"
      - "package.json"
      - "next.config.mjs"
      - "open-next.config.ts"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-app.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy app worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install --no-audit --no-fund

      # Produces .open-next/worker.js + .open-next/assets (sets CF_WORKER_BUILD internally).
      - name: Build app worker (OpenNext)
        run: npm run build:cf
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Optional public base URL (build-time). Set the NEXT_PUBLIC_BASE_URL *variable*.
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}

      # Deploys the root wrangler.toml worker (main = .open-next/worker.js).
      # Only JWT_SECRET is mapped — the other app secrets have safe defaults, and mapping
      # an unset GitHub secret would push an empty value that overrides those defaults.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
